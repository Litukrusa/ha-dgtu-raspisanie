<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Расписание</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1318;
      --bg-raise: #171e27;
      --card: #151c24;
      --line: rgba(232, 238, 244, 0.08);
      --text: #eef3f8;
      --muted: #8ea0b3;
      --accent: #7eb6ff;
      --accent-ink: #07111c;
      --now: #5ddeaf;
      --shadow: none;
      --lec: #3dd68c;
      --lab: #5aa8ff;
      --prac: #ffb020;
      --sem: #c084fc;
      --exam: #ff6b6b;
      --other: #9aa8b5;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --bg-raise: #ffffff;
        --card: #ffffff;
        --line: rgba(23, 32, 42, 0.08);
        --text: #15202b;
        --muted: #5c6e80;
        --accent: #0b6bcb;
        --accent-ink: #ffffff;
        --now: #0c8f62;
        --shadow: none;
      }
      body { background: var(--bg); }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 50% -80px, rgba(126, 182, 255, 0.14), transparent 70%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .wrap {
      width: min(640px, 100%);
      margin: 0 auto;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: 0 -16px 14px;
      padding: 8px 16px 12px;
      background: var(--bg);
      backdrop-filter: blur(10px);
    }
    .kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    #week { margin-left: auto; }
    h1 {
      margin: 4px 0 0;
      font-size: 34px;
      font-weight: 620;
      letter-spacing: -0.045em;
      line-height: 1.05;
    }
    .glance {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }
    .glance strong { color: var(--text); font-weight: 650; }
    .glance.live strong { color: var(--now); }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 14px;
    }
    .segment {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      padding: 3px;
      border-radius: 12px;
      background: var(--bg-raise);
      border: 1px solid var(--line);
    }
    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    .segment button, .nav, .chip {
      min-height: 44px;
    }
    .segment button {
      border-radius: 9px;
      color: var(--muted);
      font-weight: 650;
    }
    .segment button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .nav {
      width: 44px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--bg-raise);
      font-size: 20px;
    }
    .days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 2px;
      margin-top: 12px;
      padding: 4px;
      border-radius: 18px;
      background: var(--bg-raise);
      border: 1px solid var(--line);
    }
    .chip {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 0;
      border-radius: 14px;
      border: 0;
      color: var(--muted);
      padding: 7px 0 12px;
    }
    .chip .num {
      color: var(--text);
      font-size: 16px;
      font-weight: 680;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .chip small { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    .chip.has::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 5px;
      width: 4px;
      height: 4px;
      margin-left: -2px;
      border-radius: 50%;
      background: var(--accent);
    }
    .chip[aria-pressed="true"] { background: var(--accent); }
    .chip[aria-pressed="true"] small,
    .chip[aria-pressed="true"] .num { color: var(--accent-ink); }
    .chip[aria-pressed="true"].has::after { background: var(--accent-ink); }
    .chip.has:not([aria-pressed="true"]) .num { color: var(--text); }
    .meta {
      margin: 14px 0 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .cards { display: flex; flex-direction: column; }
    .card {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 12px;
      padding: 16px 4px;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
    }
    .card:first-child { border-top: 1px solid var(--line); }
    .kind { color: var(--other); }
    .card.lec .kind { color: var(--lec); }
    .card.lab .kind { color: var(--lab); }
    .card.prac .kind { color: var(--prac); }
    .card.sem .kind { color: var(--sem); }
    .card.exam .kind { color: var(--exam); }
    .card.current {
      margin: 0 -12px;
      padding-left: 16px;
      padding-right: 16px;
      border-radius: 18px;
      border-bottom-color: transparent;
      background: rgba(93, 222, 175, 0.1);
    }
    .when {
      font-variant-numeric: tabular-nums;
      font-weight: 720;
      font-size: 16px;
      letter-spacing: -0.03em;
    }
    .when span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 620;
    }
    .kind {
      display: inline;
      font-size: 12px;
      font-weight: 680;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .title { margin-top: 1px; font-size: 18px; font-weight: 640; letter-spacing: -0.03em; }
    .sub { margin-top: 4px; color: var(--muted); font-size: 14px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .badge, .link {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
    }
    .badge.live { color: var(--now); }
    .link { color: var(--accent); }
    .empty, .banner {
      padding: 22px 16px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .empty strong, .banner strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
      font-size: 16px;
    }
    .banner { margin-bottom: 12px; }
    .suggestions { margin: 8px 0 0; padding-left: 18px; }
    .suggestions li { margin: 4px 0; color: var(--text); }
    .pin {
      display: block;
      width: fit-content;
      margin: 22px auto 0;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 620;
    }
    .pin-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .pin-note:empty { display: none; }
    .setup { margin-top: 8px; }
    .setup[hidden], [hidden] { display: none !important; }
    .choice { margin-top: 12px; }
    #query {
      width: 100%;
      margin-top: 14px;
      min-height: 52px;
      box-sizing: border-box;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--bg-raise);
      color: var(--text);
      padding: 0 16px;
      font: inherit;
      font-size: 16px;
    }
    #query:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .hits { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .hit {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      min-height: 58px;
      padding: 10px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: transparent;
    }
    .hit::after {
      content: "›";
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
    }
    .hit strong { display: block; }
    .hit span { color: var(--muted); font-size: 13px; }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .manual {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--bg-raise);
      color: var(--text);
      font-size: 13px;
      white-space: pre-wrap;
      user-select: all;
    }
    .change {
      border: 1px solid var(--line);
      background: var(--bg-raise);
      color: var(--accent);
      font-size: 13px;
      font-weight: 650;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
    }
    .foot {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 560px) {
      h1 { font-size: 28px; }
      .card { grid-template-columns: 58px 1fr; }
      .chip small { font-size: 10px; letter-spacing: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker">
        <span id="who">Расписание</span>
        <button type="button" class="change" id="change">Сменить</button>
        <span id="week"></span>
      </div>
      <h1 id="heading">Загружаю…</h1>
      <p class="glance" id="glance"></p>
      <div class="toolbar">
        <div class="segment" role="group" aria-label="Ближайшие дни">
          <button type="button" id="btn-today" aria-pressed="true">Сегодня</button>
          <button type="button" id="btn-tomorrow" aria-pressed="false">Завтра</button>
        </div>
        <button type="button" class="nav" id="prev" aria-label="Предыдущая неделя">‹</button>
        <button type="button" class="nav" id="next" aria-label="Следующая неделя">›</button>
      </div>
      <div class="days" id="days" role="group" aria-label="Дни недели"></div>
    </header>
    <section class="setup" id="setup" hidden>
      <div class="segment choice" id="unis" role="group" aria-label="Университет">
        <button type="button" data-uni="ДГТУ" aria-pressed="true">ДГТУ</button>
        <button type="button" data-uni="ПИ" aria-pressed="false">ПИ ДГТУ</button>
      </div>
      <div class="segment choice" id="kinds" role="group" aria-label="Кого искать">
        <button type="button" data-kind="Группа" aria-pressed="true">Группа</button>
        <button type="button" data-kind="Преподаватель" aria-pressed="false">Преподаватель</button>
      </div>
      <input id="query" type="search" placeholder="Например ВИ21 или Горбанев" autocomplete="off" enterkeyhint="search">
      <p class="hint" id="search-hint">Введите хотя бы 2 буквы и выберите строку из списка.</p>
      <div class="hits" id="hits"></div>
    </section>
    <div id="notice"></div>
    <div class="meta" id="meta"></div>
    <div class="cards" id="cards"></div>
    <button type="button" class="pin" id="pin">На главный экран</button>
    <p class="pin-note" id="pin-note"></p>
    <div class="foot" id="foot"></div>
  </div>
  <script>
    const base = location.pathname.replace(/[^/]*$/, "");
    const state = { payload: null, selected: null, picking: false };

    const btnToday = document.getElementById("btn-today");
    const btnTomorrow = document.getElementById("btn-tomorrow");
    btnToday.addEventListener("click", () => go(state.payload && state.payload.today));
    btnTomorrow.addEventListener("click", () => go(state.payload && addDays(state.payload.today, 1)));
    document.getElementById("prev").addEventListener("click", () => shift(-1));
    document.getElementById("next").addEventListener("click", () => shift(1));

    function addDays(iso, count) {
      const [year, month, day] = iso.split("-").map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      date.setUTCDate(date.getUTCDate() + count);
      return date.toISOString().slice(0, 10);
    }

    function moscowNow() {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Moscow",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      }).formatToParts(new Date());
      const map = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return Number(map.hour) * 60 + Number(map.minute);
    }

    function minutes(value) {
      const [hour, minute] = (value || "").split(":");
      if (!hour || minute === undefined) return null;
      return Number(hour) * 60 + Number(minute);
    }

    function lessonsWord(count) {
      const mod10 = count % 10;
      const mod100 = count % 100;
      if (mod10 === 1 && mod100 !== 11) return "пара";
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return "пары";
      return "пар";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function load(date) {
      const heading = document.getElementById("heading");
      if (!state.payload) heading.textContent = "Загружаю…";
      const query = date ? "?date=" + encodeURIComponent(date) : "";
      let payload;
      try {
        const response = await fetch(base + "api/schedule" + query, { cache: "no-store" });
        payload = await response.json();
      } catch (error) {
        payload = { ok: false, error: "Не удалось связаться с приложением расписания." };
      }
      state.payload = payload;
      state.selected = payload.selected || payload.today || date || state.selected;
      render();
    }

    function go(date) {
      if (!date) return;
      const loaded = state.payload && state.payload.days && state.payload.days[0];
      if (loaded && addDays(loaded.date, 6) >= date && loaded.date <= date) {
        state.selected = date;
        render();
        return;
      }
      load(date);
    }

    function shift(delta) {
      if (!state.selected) return;
      load(addDays(state.selected, 7 * delta));
    }

    function render() {
      const payload = state.payload || { ok: false, error: "Нет данных" };
      const notice = document.getElementById("notice");
      const cards = document.getElementById("cards");
      const days = document.getElementById("days");
      const meta = document.getElementById("meta");
      const foot = document.getElementById("foot");
      notice.innerHTML = "";
      cards.innerHTML = "";
      days.innerHTML = "";
      meta.textContent = "";
      foot.textContent = "";

      if (!payload.ok) {
        document.getElementById("who").textContent = "Расписание";
        document.getElementById("week").textContent = "";
        const needsChoice = /Укажите группу|не найдена|несколько|Несколько/.test(payload.error || "");
        setSetup(needsChoice || state.picking);
        if (needsChoice && !state.picking) {
          document.getElementById("heading").textContent = "Выберите группу";
          document.getElementById("glance").textContent = "Найдите группу или преподавателя и нажмите на строку.";
          notice.innerHTML = "";
        } else if (!state.picking) {
          document.getElementById("heading").textContent = "Расписание не открылось";
          document.getElementById("glance").textContent = "";
          const items = (payload.suggestions || []).map((name) => `<li>${escapeHtml(name)}</li>`).join("");
          notice.innerHTML = `<div class="banner"><strong>${escapeHtml(payload.error || "Ошибка")}</strong>${
            items ? `<ul class="suggestions">${items}</ul>` : ""
          }</div>`;
        }
        setPressed(null, null);
        return;
      }
      if (!state.picking) setSetup(false);

      const today = payload.today;
      const tomorrow = addDays(today, 1);
      const selected = state.selected || today;
      const day = (payload.days || []).find((item) => item.date === selected) || payload.days[0];
      document.getElementById("who").textContent = payload.title + " · " + payload.university;
      const weekBits = [];
      if (payload.week_number) weekBits.push(payload.week_number + " неделя");
      if (payload.week_kind) weekBits.push(payload.week_kind);
      document.getElementById("week").textContent = weekBits.join(" · ");

      let heading = day.weekday + ", " + day.day + " " + day.month;
      if (day.date === today) heading = "Сегодня, " + day.day + " " + day.month;
      if (day.date === tomorrow) heading = "Завтра, " + day.day + " " + day.month;
      document.getElementById("heading").textContent = heading;
      setPressed(day.date === today, day.date === tomorrow);
      renderGlance(day, day.date === today, payload.person);
      renderDays(payload.days, selected);

      if (payload.stale) {
        notice.innerHTML = `<div class="banner"><strong>Показана сохранённая копия</strong>Сайт университета сейчас не ответил.</div>`;
      }
      const count = day.lessons.length;
      meta.textContent = count ? `${count} ${lessonsWord(count)}` : "";
      if (!count) {
        cards.innerHTML = `<div class="empty"><strong>Пар нет</strong>${
          day.date === today ? "На сегодня расписание пустое." : "В этот день занятий нет."
        }</div>`;
      } else {
        const now = day.date === today ? moscowNow() : null;
        cards.innerHTML = day.lessons.map((lesson) => cardHtml(lesson, now, payload.person)).join("");
      }
      if (payload.updated) {
        const stamp = payload.updated.replace("T", " ").slice(0, 16);
        foot.textContent = "Расписание на сайте обновляли " + stamp;
      }
    }

    function renderGlance(day, isToday, person) {
      const glance = document.getElementById("glance");
      glance.classList.remove("live");
      if (!isToday) {
        const first = day.lessons[0];
        glance.innerHTML = first
          ? `Первая пара в <strong>${escapeHtml(first.start)}</strong> · ${escapeHtml(first.title)}`
          : "В этот день занятий нет";
        return;
      }
      const now = moscowNow();
      const current = day.lessons.find((lesson) => {
        const start = minutes(lesson.start);
        const end = minutes(lesson.end);
        return start !== null && end !== null && now >= start && now < end;
      });
      if (current) {
        glance.classList.add("live");
        glance.innerHTML = `Сейчас <strong>${escapeHtml(current.title)}</strong> · до ${escapeHtml(current.end)}`;
        return;
      }
      const next = day.lessons.find((lesson) => minutes(lesson.start) > now);
      if (next) {
        const who = person === "teacher" ? next.group : next.teacher;
        glance.innerHTML = `Дальше в <strong>${escapeHtml(next.start)}</strong> · ${escapeHtml(next.title)}${
          who ? " · " + escapeHtml(who) : ""
        }`;
        return;
      }
      glance.textContent = day.lessons.length ? "На сегодня всё" : "На сегодня пар нет";
    }

    function renderDays(items, selected) {
      document.getElementById("days").innerHTML = items.map((day) => {
        const pressed = day.date === selected ? "true" : "false";
        const has = day.lessons.length ? " has" : "";
        return `<button type="button" class="chip${has}" data-date="${day.date}" aria-pressed="${pressed}"><small>${day.short}</small><span class="num">${day.day}</span></button>`;
      }).join("");
      document.querySelectorAll(".chip").forEach((button) => {
        button.addEventListener("click", () => go(button.dataset.date));
      });
    }

    function cardHtml(lesson, now, person) {
      const start = minutes(lesson.start);
      const end = minutes(lesson.end);
      const current = now !== null && start !== null && end !== null && now >= start && now < end;
      const who = person === "teacher" ? lesson.group : lesson.teacher;
      const where = [lesson.room, lesson.subgroup ? "п/г " + lesson.subgroup : ""]
        .filter(Boolean)
        .join(" · ");
      const badges = [];
      if (current) badges.push(`<span class="badge live">Сейчас</span>`);
      if (lesson.replaced) badges.push(`<span class="badge">Замена</span>`);
      if (lesson.link) badges.push(`<a class="link" href="${escapeHtml(lesson.link)}" target="_blank" rel="noopener">Открыть занятие</a>`);
      return `<article class="card ${escapeHtml(lesson.kind)}${current ? " current" : ""}">
        <div class="when">${escapeHtml(lesson.start)}<span>${escapeHtml(lesson.end)}</span></div>
        <div>
          <div class="kind">${escapeHtml(lesson.kind_label)}</div>
          <div class="title">${escapeHtml(lesson.title)}</div>
          ${who ? `<div class="sub">${escapeHtml(who)}</div>` : ""}
          ${where ? `<div class="sub">${escapeHtml(where)}</div>` : ""}
          ${lesson.topic ? `<div class="sub">${escapeHtml(lesson.topic)}</div>` : ""}
          ${badges.length ? `<div class="badges">${badges.join("")}</div>` : ""}
        </div>
      </article>`;
    }

    function setPressed(today, tomorrow) {
      btnToday.setAttribute("aria-pressed", today ? "true" : "false");
      btnTomorrow.setAttribute("aria-pressed", tomorrow ? "true" : "false");
    }

    const CARD_RESOURCE = "/local/dgtu-raspisanie-card.js?v=1.3.0";
    const embed = new URLSearchParams(location.search).get("embed") === "1";
    const picker = { university: "ДГТУ", target: "Группа" };
    if (embed) document.getElementById("pin").hidden = true;
    document.getElementById("pin").addEventListener("click", pinToDashboard);
    document.getElementById("change").addEventListener("click", () => {
      state.picking = true;
      setSetup(true);
      document.getElementById("heading").textContent = "Выберите группу";
      document.getElementById("glance").textContent = "Найдите группу или преподавателя и нажмите на строку.";
      document.getElementById("query").focus();
    });
    document.getElementById("unis").addEventListener("click", (event) => {
      const button = event.target.closest("[data-uni]");
      if (!button) return;
      picker.university = button.dataset.uni;
      document.querySelectorAll("[data-uni]").forEach((item) => item.setAttribute("aria-pressed", item === button));
      queueSearch();
    });
    document.getElementById("kinds").addEventListener("click", (event) => {
      const button = event.target.closest("[data-kind]");
      if (!button) return;
      picker.target = button.dataset.kind;
      document.querySelectorAll("[data-kind]").forEach((item) => item.setAttribute("aria-pressed", item === button));
      document.getElementById("query").placeholder = picker.target === "Группа" ? "Например ВИ21" : "Например Горбанев";
      queueSearch();
    });
    document.getElementById("query").addEventListener("input", queueSearch);

    let searchTimer = 0;
    function queueSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, 250);
    }

    async function runSearch() {
      const query = document.getElementById("query").value.trim();
      const hint = document.getElementById("search-hint");
      const hits = document.getElementById("hits");
      if (query.length < 2) {
        hint.textContent = "Введите хотя бы 2 буквы и выберите строку из списка.";
        hits.innerHTML = "";
        return;
      }
      hint.textContent = "Ищу…";
      const params = new URLSearchParams({ university: picker.university, target: picker.target, q: query });
      let payload;
      try {
        const response = await fetch(base + "api/search?" + params.toString(), { cache: "no-store" });
        payload = await response.json();
      } catch (error) {
        hint.textContent = "Не удалось выполнить поиск.";
        return;
      }
      if (!payload.ok) {
        hint.textContent = payload.error || "Поиск не удался.";
        hits.innerHTML = "";
        return;
      }
      const results = payload.results || [];
      hint.textContent = results.length ? "Нажмите на свою строку." : "Ничего не найдено. Проверьте университет и написание.";
      hits.innerHTML = results.map((item) => `
        <button type="button" class="hit" data-name="${escapeHtml(item.name)}">
          <strong>${escapeHtml(item.name)}</strong>
          ${item.detail ? `<span>${escapeHtml(item.detail)}</span>` : ""}
        </button>`).join("");
      hits.querySelectorAll(".hit").forEach((button) => {
        button.addEventListener("click", () => choose(button.dataset.name));
      });
    }

    async function choose(name) {
      const hint = document.getElementById("search-hint");
      hint.textContent = "Открываю расписание…";
      const response = await fetch(base + "api/profile", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ university: picker.university, target: picker.target, name })
      });
      const payload = await response.json();
      if (!payload.ok) {
        hint.textContent = payload.error || "Не удалось сохранить выбор.";
        return;
      }
      state.picking = false;
      state.selected = null;
      load();
    }

    function setSetup(open) {
      document.getElementById("setup").hidden = !open;
      document.querySelector(".toolbar").hidden = open;
      document.getElementById("days").hidden = open;
      document.getElementById("meta").hidden = open;
      document.getElementById("cards").hidden = open;
      document.getElementById("pin").hidden = open || embed;
      document.getElementById("change").hidden = open;
    }

    function parentHass() {
      try {
        const root = window.parent.document.querySelector("home-assistant");
        return root && root.hass ? root.hass : null;
      } catch (error) {
        return null;
      }
    }

    function containsCard(node) {
      if (!node || typeof node !== "object") return false;
      if (node.type === "custom:dgtu-raspisanie-card") return true;
      if (node.type === "iframe" && String(node.url || "").includes("hassio_ingress")) return true;
      return ["cards", "sections", "views"].some((key) => Array.isArray(node[key]) && node[key].some(containsCard));
    }

    function insertCard(view, card) {
      if (Array.isArray(view.sections)) {
        if (!view.sections.length) view.sections.push({ type: "grid", cards: [] });
        const cards = view.sections[0].cards || (view.sections[0].cards = []);
        const index = cards[0] && cards[0].type === "heading" ? 1 : 0;
        cards.splice(index, 0, card);
        return;
      }
      view.cards = view.cards || [];
      view.cards.unshift(card);
    }

    function callHass(hass, message) {
      if (typeof hass.callWS === "function") return hass.callWS(message);
      return hass.connection.sendMessagePromise(message);
    }

    function ingressCard() {
      const path = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
      return { type: "iframe", url: path + "?embed=1", aspect_ratio: "140%" };
    }

    function showManual(note, reason) {
      const card = ingressCard();
      const yaml = "type: iframe\nurl: " + card.url + "\naspect_ratio: \"140%\"";
      note.innerHTML = `${reason ? escapeHtml(reason) + ". " : ""}В поиске карточек наберите «Ручная» и вставьте:<pre class="manual">${escapeHtml(yaml)}</pre>`;
    }

    async function pinToDashboard() {
      const note = document.getElementById("pin-note");
      const hass = parentHass();
      if (!hass) {
        note.textContent = "Откройте «Расписание» из боковой панели Home Assistant, не из отдельной вкладки.";
        return;
      }
      note.textContent = "Добавляю на обзор…";
      let customReady = false;
      try {
        const resources = asList(await callHass(hass, { type: "lovelace/resources" }));
        const current = resources.find((item) => (item.url || "").includes("dgtu-raspisanie-card.js"));
        if (!current) {
          await callHass(hass, { type: "lovelace/resources/create", url: CARD_RESOURCE, res_type: "module" });
        } else if (current.url !== CARD_RESOURCE) {
          await callHass(hass, {
            type: "lovelace/resources/update",
            resource_id: current.id,
            url: CARD_RESOURCE,
            res_type: "module",
          });
        }
        customReady = true;
      } catch (error) {
        customReady = false;
      }
      try {
        const config = await callHass(hass, { type: "lovelace/config", url_path: null });
        const views = config.views || [];
        if (!views.length || config.strategy || views[0].strategy) {
          showManual(note, "Этот обзор собран автоматически");
          return;
        }
        if (containsCard(views[0])) {
          note.textContent = "Расписание уже есть на главном экране. Обновите обзор.";
          return;
        }
        insertCard(views[0], customReady ? { type: "custom:dgtu-raspisanie-card", grid_options: { columns: 12, rows: "auto" } } : ingressCard());
        await callHass(hass, { type: "lovelace/config/save", url_path: null, config });
        note.textContent = "Готово. Обновите главную страницу — расписание будет на обзоре.";
      } catch (error) {
        showManual(note, error.message || "Не удалось сохранить обзор");
      }
    }

    function asList(value) {
      if (Array.isArray(value)) return value;
      if (value && Array.isArray(value.resources)) return value.resources;
      return [];
    }

    load(new URLSearchParams(location.search).get("date"));
    setInterval(() => {
      const payload = state.payload;
      if (!payload || !payload.ok || state.selected !== payload.today) return;
      const day = (payload.days || []).find((item) => item.date === payload.today);
      if (!day) return;
      renderGlance(day, true, payload.person);
      const now = moscowNow();
      document.getElementById("cards").innerHTML = day.lessons.length
        ? day.lessons.map((lesson) => cardHtml(lesson, now, payload.person)).join("")
        : document.getElementById("cards").innerHTML;
    }, 30000);
    setInterval(() => {
      if (state.selected) load(state.selected);
    }, 5 * 60 * 1000);
  </script>
</body>
</html>
