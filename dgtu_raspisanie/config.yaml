name: Расписание ДГТУ
version: "1.2.0"
slug: dgtu_raspisanie
description: Расписание ДГТУ и ПИ ДГТУ на сегодня, завтра и любой другой день
url: https://github.com/Litukrusa/ha-dgtu-raspisanie
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
homeassistant_api: true
map:
  - homeassistant_config:rw
ingress_port: 8099
panel_icon: mdi:calendar-clock
panel_title: Расписание
panel_admin: false
webui: "http://[HOST]:[PORT:8099]/"
watchdog: "http://[HOST]:[PORT:8099]/api/health"
options:
  university: ДГТУ
  target: Группа
  name: ""
  refresh_minutes: 20
  subgroup: 0
schema:
  university: "list(ДГТУ|ПИ)"
  target: "list(Группа|Преподаватель)"
  name: str
  refresh_minutes: "int(5,180)"
  subgroup: "int(0,20)"
ports:
  "8099/tcp": 8099
ports_description:
  "8099/tcp": Страница расписания для карточки на обзоре
